location: australiaeast
resourceGroup: ai-platform
type: Microsoft.App/containerApps
name: elasticsearch
properties:
  environmentId: /subscriptions/53f34d3b-bdc7-4e68-89c4-0e4f1947eb31/resourceGroups/ai-platform/providers/Microsoft.App/managedEnvironments/managedEnvironment-aiplatform-8573
  configuration:
    ingress:
      external: false
      targetPort: 9200
      transport: http
  template:
    containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
        resources:
          cpu: "2.0"
          memory: 4Gi
        env:
          - name: discovery.type
            value: single-node
          - name: xpack.security.enabled
            value: "false"
          - name: ES_JAVA_OPTS
            value: "-Xms1g -Xmx1g"
          - name: cluster.name
            value: ai-platform-logs
        volumeMounts:
          - volumeName: elasticsearch-data
            mountPath: /usr/share/elasticsearch/data
    volumes:
      - name: elasticsearch-data
        storageType: AzureFile
        storageName: elasticsearch-storage
    scale:
      minReplicas: 1
      maxReplicas: 1
