name: ai-platform

networks:
  ai-platform:
    driver: bridge

volumes:
  postgres_data:
  chromadb_data:
  ollama_data:
  elasticsearch_data:

services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiplatform}
      POSTGRES_USER: ${POSTGRES_USER:-aiplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiplatform_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ai-platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ai-platform
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.15
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8001:8000"
    networks:
      - ai-platform
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic_secret}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - ai-platform
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD:-elastic_secret} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 40s

  kibana:
    image: kibana:8.13.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-elastic_secret}
    ports:
      - "5601:5601"
    networks:
      - ai-platform
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── AI Services ───────────────────────────────────────────────────────────────

  ollama:
    build:
      context: ./ollama-service
    environment:
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - ai-platform
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # gRPC server — used internally by chat-service
  chatbot-service:
    build:
      context: ./chatbot-service
    environment:
      CHROMA_MODE: http
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      CHROMADB_SSL: "false"
      COLLECTION_NAME: ${COLLECTION_NAME:-oconnors_ims}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_ENDPOINT: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      AZURE_FOUNDRY_KEY: ${AZURE_FOUNDRY_KEY:-}
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT:-}
      AZURE_FOUNDRY_MODEL: ${AZURE_FOUNDRY_MODEL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aiplatform}
      POSTGRES_USER: ${POSTGRES_USER:-aiplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiplatform_secret}
      POSTGRES_SSL: disable
      LOG_FILE: /var/log/app/chatbot-service.log
      RAG_DOMAIN: ${RAG_DOMAIN:-}
      RAG_RETRIEVAL_K: ${RAG_RETRIEVAL_K:-30}
      RAG_TOP_K: ${RAG_TOP_K:-5}
    ports:
      - "50051:50051"
    networks:
      - ai-platform
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # FastAPI HTTP server — accessed via Kong at /api/chatbot
  chatbot-api:
    build:
      context: ./chatbot-service
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CHROMA_MODE: http
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      CHROMADB_SSL: "false"
      COLLECTION_NAME: ${COLLECTION_NAME:-oconnors_ims}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_ENDPOINT: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      AZURE_FOUNDRY_KEY: ${AZURE_FOUNDRY_KEY:-}
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT:-}
      AZURE_FOUNDRY_MODEL: ${AZURE_FOUNDRY_MODEL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aiplatform}
      POSTGRES_USER: ${POSTGRES_USER:-aiplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiplatform_secret}
      POSTGRES_SSL: disable
      RAG_DOMAIN: ${RAG_DOMAIN:-}
    ports:
      - "8002:8000"
    networks:
      - ai-platform
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # ── Application Services ──────────────────────────────────────────────────────

  authentication-service:
    build:
      context: ./authentication-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aiplatform}
      DB_USERNAME: ${POSTGRES_USER:-aiplatform}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aiplatform_secret}
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_secret_min_32_characters_long}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-900}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-604800}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      LOGGING_FILE_NAME: /var/log/app/authentication-service.log
    ports:
      - "8081:8081"
    networks:
      - ai-platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-service:
    build:
      context: ./chat-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aiplatform}
      DB_USERNAME: ${POSTGRES_USER:-aiplatform}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aiplatform_secret}
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_secret_min_32_characters_long}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      CHATBOT_SERVER_ADDRESS: chatbot-service:50051
      LOGGING_FILE_NAME: /var/log/app/chat-service.log
    ports:
      - "8082:8082"
    networks:
      - ai-platform
    depends_on:
      postgres:
        condition: service_healthy
      chatbot-service:
        condition: service_started

  document-service:
    build:
      context: ./document-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aiplatform}
      DB_USERNAME: ${POSTGRES_USER:-aiplatform}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aiplatform_secret}
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_secret_min_32_characters_long}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      SHAREPOINT_CLIENT_ID: ${SHAREPOINT_CLIENT_ID}
      SHAREPOINT_CLIENT_SECRET: ${SHAREPOINT_CLIENT_SECRET}
      SHAREPOINT_TENANT_ID: ${AZURE_TENANT_ID}
      SHAREPOINT_HOST: oconnorservicescomau.sharepoint.com
      SHAREPOINT_SITE_NAME: UoACapstoneProject
      LOGGING_FILE_NAME: /var/log/app/document-service.log
    ports:
      - "8083:8080"
    networks:
      - ai-platform
    depends_on:
      postgres:
        condition: service_healthy

  evaluation-service:
    build:
      context: ./evaluation-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aiplatform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aiplatform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aiplatform_secret}
    ports:
      - "8084:8080"
    networks:
      - ai-platform
    depends_on:
      postgres:
        condition: service_healthy

  # ── API Gateway ───────────────────────────────────────────────────────────────

  kong:
    build:
      context: ./kong-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yaml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong-gateway/kong.local.yaml:/etc/kong/kong.yaml.template:ro
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8443:8443"
    networks:
      - ai-platform
    depends_on:
      authentication-service:
        condition: service_started
      chat-service:
        condition: service_started
      document-service:
        condition: service_started
      chatbot-api:
        condition: service_started

  # ── Frontend ──────────────────────────────────────────────────────────────────

  user-interface:
    build:
      context: ./user-interface
      args:
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
        VITE_AZURE_AUTHORITY: ${VITE_AZURE_AUTHORITY}
        VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI:-http://localhost:3000}
        VITE_AZURE_SCOPE: ${VITE_AZURE_SCOPE}
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL:-http://localhost:8000}
        VITE_CHAT_SERVICE_URL: ${VITE_CHAT_SERVICE_URL:-http://localhost:8000}
        VITE_DOCUMENT_SERVICE_URL: ${VITE_DOCUMENT_SERVICE_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    networks:
      - ai-platform
    depends_on:
      - kong

  # ── Batch Jobs ────────────────────────────────────────────────────────────────
  # Run with: docker compose --profile etl up etl-service

  etl-service:
    build:
      context: ./etl-service
    environment:
      PIPELINE_MODE: ${PIPELINE_MODE:-live}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      SHAREPOINT_HOST: oconnorservicescomau.sharepoint.com
      SHAREPOINT_SITE_NAME: UoACapstoneProject
      SHAREPOINT_TARGET_FOLDER: ${SHAREPOINT_TARGET_FOLDER:-IMS}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-aiplatform}:${POSTGRES_PASSWORD:-aiplatform_secret}@postgres:5432/${POSTGRES_DB:-aiplatform}
      CHROMA_MODE: http
      CHROMA_HTTP_HOST: chromadb
      CHROMA_HTTP_PORT: 8000
      CHROMA_HTTP_SSL: "False"
      CHROMA_COLLECTION: ${COLLECTION_NAME:-oconnors_ims}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      ANONYMIZED_TELEMETRY: "False"
    networks:
      - ai-platform
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    profiles:
      - etl
